[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberai-lab"
version = "1.1.0"
description = "Extensible AI-assisted CLI for authorized security education and research."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Muqtada Al-Sadr Jarallah Khalif"}]
dependencies = ["requests>=2.32.0,<3.0.0", "python-dotenv>=1.1.0,<2.0.0"]
keywords = ["cybersecurity", "education", "security-research", "ai", "cli", "ctf", "defensive-security"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
[project.urls]
Homepage = "https://github.com/hfsduu5-coder/CyberAI-Lab"
Repository = "https://github.com/hfsduu5-coder/CyberAI-Lab"
Issues = "https://github.com/hfsduu5-coder/CyberAI-Lab/issues"

[project.scripts]
cyberai = "cyberai.cli:main"

[tool.setuptools.packages.find]
include = ["cyberai*"]
